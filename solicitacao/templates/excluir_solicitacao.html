{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3 class="display-4 text-center">Excluir Solicitação</h3>
    <div class="card">
        <div class="card-body">
            <p>Você tem certeza que deseja excluir esta solicitação?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Excluir</button>
                <a href="{% url 'solicitacao_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
