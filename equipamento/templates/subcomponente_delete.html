{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
  <div class="row">
    <div class="col-md-12">
      <h3 class="display-4 text-center">Excluir Subcomponente</h3>
      <div class="card">
        <div class="card-body">
          <p>Tem certeza de que deseja excluir o subcomponente "{{ object.nome }}"?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
            <a href="{% url 'subcomponente_detail' pk=object.pk %}" class="btn btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
