{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <h3 class="display-4 text-center">Editar Subcomponente</h3>
      <div class="card">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'subcomponente_detail' pk=object.pk %}" class="btn btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
