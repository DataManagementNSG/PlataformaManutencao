{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h3 class="display-4 text-center">Editar Equipamento</h3>

  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'equipamento_detail' pk=form.instance.pk %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
