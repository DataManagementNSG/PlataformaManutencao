{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h3 class="display-4 text-center">Editar Produto</h3>

  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data" action="{% url 'spare_update' pk=object.pk %}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="{% url 'spare_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const form = document.querySelector('form');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    Swal.fire({
      title: 'Você tem certeza?',
      text: "Você deseja salvar as alterações?",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Sim, salvar!',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        form.submit();
      }
    });
  });
});
</script>
{% endblock %}
{% endblock %}
