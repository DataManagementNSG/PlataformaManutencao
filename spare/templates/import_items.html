{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h3 class="display-4 text-center mb-4">Upload de Planilha SAP</h3>

  <!-- Card para o formulário -->
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Adiciona o campo de upload com estilo -->
        <div class="mb-3">
          <label for="id_planilha" class="form-label">Selecione a base de dados SAP:</label>
          <!-- Aplicar a classe diretamente no campo do formulário -->
          <input type="file" id="id_planilha" name="planilha" class="form-control">
        </div>
        
        <!-- Botão de submit com estilo -->
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary btn-lg">Upload</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
