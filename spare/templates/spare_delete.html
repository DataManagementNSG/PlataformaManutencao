{% extends "base.html" %}
{% block title %}
  Deletar Material
{% endblock %}
{% block content %}
  
  <div class="container mt-4">
    <h3 class="display-4 text-center">Deletar Material</h3>

    <div class="card">
      <div class="card-body">
        <p class="card-text">Tem certeza de que deseja excluir o Spare <strong>{{ object.nome }}</strong>?</p>

        <form method="post" id="delete-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Deletar</button>
          <a href="{% url 'spare_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>

  <!-- Script para SweetAlert2 -->
  {% block extra_js %}
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.querySelector('#delete-form').addEventListener('submit', function(event) {
      event.preventDefault(); // Impede o envio do formulário

      Swal.fire({
        title: 'Você tem certeza?',
        text: "Esta ação não pode ser desfeita!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, deletar!',
        cancelButtonText: 'Não, cancelar'
      }).then((result) => {
        if (result.isConfirmed) {
          event.target.submit(); // Envia o formulário se confirmado
        }
      });
    });
  </script>
  {% endblock %}
{% endblock %}
