{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
  <h3 class="display-4 text-center">Upload de Planilha Excel</h3>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Importar</button>
    <a href="{% url 'preventiva_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
  {% if messages %}
    <div class="mt-3">
      <ul class="list-group">
        {% for message in messages %}
          <li class="list-group-item list-group-item-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
</div>

{% endblock %}
