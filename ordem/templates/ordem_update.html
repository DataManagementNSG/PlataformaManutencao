{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
  <h3 class="display-4 text-center">Editar Ordem</h3>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <a href="{% url 'ordem_detail' pk=ordem.pk %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
