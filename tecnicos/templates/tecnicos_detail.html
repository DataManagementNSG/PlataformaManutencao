<!-- tecnicos_detail.html -->
{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h3 class="display-4 text-center">Detalhes do Técnico</h3>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{ tecnico.nome }}</h5>
        <p class="card-text"><strong>Email:</strong> {{ tecnico.email }}</p>
        <p class="card-text"><strong>Centro de Trabalho:</strong> {{ tecnico.centro_trabalho_responsavel }}</p>
        <p class="card-text"><strong>Especialidade:</strong> {{ tecnico.especialidade }}</p>
        <a href="{% url 'tecnicos_list' %}" class="btn btn-secondary">Voltar</a>
        <a href="{% url 'tecnicos_delete' tecnico.pk %}" class="btn btn-danger">Deletar</a>
      </div>
    </div>
  </div>
{% endblock %}
