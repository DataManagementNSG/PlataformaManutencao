<!-- tecnicos_form.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <div class="container-fluid mt-4 border border-gray rounded shadow-lg p-4 mb-4">
  <h3 class="display-4 text-center">{% if object.pk %}Editar{% else %}Adicionar{% endif %} Técnico</h3>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="{% url 'tecnicos_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const form = document.querySelector('form');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    Swal.fire({
      title: 'Confirmação Necessária',
      text: "{% if form.instance.pk %}Você deseja atualizar este técnico?{% else %}Você deseja adicionar este técnico?{% endif %}",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Sim, registrar!',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        form.submit();
      }
    });
  });
});
</script>
{% endblock %}
